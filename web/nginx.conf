# ForeverArt SPA (web app) nginx server block
# 部署位置: /etc/nginx/sites-available/foreverart-app -> sites-enabled/foreverart-app
#
# HTTPS: 域名解析生效后执行
#   sudo certbot --nginx -d app.foreverart.vip
# certbot 会自动在本 block 上补 443/ssl，并把 80 跳转 443。

server {
    listen 80;
    server_name app.foreverart.vip;

    root /home/admin/foreverart-backend/web/dist;
    index index.html;

    # SPA fallback: 所有路径都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # 静态资源长缓存（文件名含 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
