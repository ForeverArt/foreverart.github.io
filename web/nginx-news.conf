# ForeverArt News SPA nginx server block
# 部署位置: /etc/nginx/sites-available/foreverart-news -> sites-enabled/foreverart-news
#
# SSL 证书由 certbot 管理（自动续期），路径固定不变。
# 首次: sudo certbot certonly --nginx -d news.foreverart.vip

# HTTP → HTTPS
server {
    listen 80;
    server_name news.foreverart.vip;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name news.foreverart.vip;

    ssl_certificate /etc/letsencrypt/live/news.foreverart.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/news.foreverart.vip/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000" always;

    root /home/admin/foreverart-backend/web/dist;
    index index.html;

    # SPA fallback: 所有路径都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # 静态资源长缓存（文件名含 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # TrendRadar 官方 HTML 报告（可选，通过 /report/ 访问）
    location /report/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 1h;
    }
}
