# ForeverArt backend nginx server block
# 部署位置: /etc/nginx/sites-available/foreverart -> sites-enabled/foreverart
#
# SSL 证书由 certbot 管理（自动续期），路径固定不变。
# 首次: sudo certbot certonly --nginx -d api.foreverart.vip

# HTTP → HTTPS
server {
    listen 80;
    server_name api.foreverart.vip;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name api.foreverart.vip;

    ssl_certificate /etc/letsencrypt/live/api.foreverart.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.foreverart.vip/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # spin report 请求体为 FeatureTimeline/SpinSession JSON（上限 5MiB，与后端 MAX_BODY_BYTES 对齐）
    client_max_body_size 6m;

    # 根路径跳转到 Dashboard
    location = / {
        return 302 /dashboard/;
    }

    # API 反代到 foreverart-api（systemd, 127.0.0.1:8081）
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM 报告生成可能耗时数十秒
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 后端管理 Dashboard（backend-dashboard 构建产物，由 CI 解压到此路径）
    location /dashboard/ {
        alias /home/admin/foreverart-backend/backend-dashboard/dist/;
        try_files $uri $uri/ /dashboard/index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
