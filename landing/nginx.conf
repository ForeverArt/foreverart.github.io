# ForeverArt landing page nginx server block
# 部署位置: /etc/nginx/sites-available/foreverart-landing -> sites-enabled/foreverart-landing
#
# HTTPS: 域名解析生效后执行
#   sudo certbot --nginx -d foreverart.vip
# certbot 会自动在本 block 上补 443/ssl，并把 80 跳转 443。

server {
    listen 80;
    server_name foreverart.vip www.foreverart.vip;

    root /home/admin/foreverart-backend/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
