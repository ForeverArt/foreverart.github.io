# ForeverArt landing page nginx server block
# 部署位置: /etc/nginx/sites-available/foreverart-landing -> sites-enabled/foreverart-landing
#
# SSL 证书由 certbot 管理（自动续期），路径固定不变。
# 首次: sudo certbot certonly --nginx -d foreverart.vip -d www.foreverart.vip

# HTTP → HTTPS
server {
    listen 80 default_server;
    server_name foreverart.vip www.foreverart.vip;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl default_server;
    server_name foreverart.vip www.foreverart.vip;

    ssl_certificate /etc/letsencrypt/live/foreverart.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foreverart.vip/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000" always;

    root /home/admin/foreverart-backend/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
