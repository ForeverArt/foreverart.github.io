name: Build Spin Tracker

on:
  push:
    branches: [master]
    paths:
      - 'figure-skating-spin-tracker/web/src/**'
      - 'figure-skating-spin-tracker/web/package*.json'
      - 'figure-skating-spin-tracker/web/vite.config.ts'
      - 'figure-skating-spin-tracker/web/tailwind.config.ts'
      - 'figure-skating-spin-tracker/web/tsconfig*.json'
      - 'figure-skating-spin-tracker/web/index.html'
      - 'figure-skating-spin-tracker/web/postcss.config.js'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: figure-skating-spin-tracker/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: figure-skating-spin-tracker/web

      - name: Build
        run: npm run build
        working-directory: figure-skating-spin-tracker/web

      - name: Commit and push dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add figure-skating-spin-tracker/web/dist/
          git diff --staged --quiet || git commit -m "ci: build spin-tracker dist [skip ci]"
          git push
