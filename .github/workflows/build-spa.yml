name: Build SPA

on:
  push:
    branches: [master]
    paths:
      - 'web/src/**'
      - 'web/package.json'
      - 'web/yarn.lock'
      - 'web/vite.config.ts'
      - 'web/tailwind.config.ts'
      - 'web/tsconfig.json'
      - 'web/tsconfig.app.json'
      - 'web/index.html'
      - 'web/postcss.config.js'
      - '.github/workflows/build-spa.yml'
  pull_request:
    paths:
      - 'web/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: web/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: web

      - name: Build
        env:
          VITE_BACKEND_BASE_URL: https://api.foreverart.vip
        run: yarn build
        working-directory: web
