name: Deploy backend to Alibaba Cloud

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'backend-dashboard/**'
      - 'web/**'
      - 'landing/**'
      - 'deploy/trendradar/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build backend binary
        working-directory: backend
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          go build -ldflags "-s -w -X github.com/foreverart/foreverart.github.io/backend/internal/version.BuildTime=${BUILD_TIME}" -o ../foreverart-api ./cmd/server
          ls -lh ../foreverart-api

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build admin dashboard
        working-directory: backend-dashboard
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Build SPA
        working-directory: web
        env:
          VITE_BACKEND_BASE_URL: https://api.foreverart.vip
        run: |
          yarn install --frozen-lockfile
          yarn build --outDir dist
          # mediapipe WASM files were copied to repo root by viteStaticCopy,
          # need them in web/dist/ for server deployment
          cp -r ../mediapipe dist/ 2>/dev/null || true

      - name: Package and transfer
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.HOST }}
        run: |
          tar czf deploy.tar.gz foreverart-api backend-dashboard/dist web/dist deploy/trendradar
          ls -lh deploy.tar.gz

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/deploy_key deploy.tar.gz admin@"$HOST":/tmp/deploy-foreverart.tar.gz

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: admin
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/admin/foreverart-backend

            # 清理上次 tar 解压遗留的 untracked 文件，避免 git pull 冲突
            rm -rf deploy/

            # 先拉代码，再解压 tar（tar 里包含已跟踪的 deploy/trendradar 和构建产物）
            git pull origin master
            tar xzf /tmp/deploy-foreverart.tar.gz && rm /tmp/deploy-foreverart.tar.gz

            # ── TrendRadar 部署（幂等，安全重复执行）──
            TRENDRADAR_DIR=/home/admin/trendradar
            mkdir -p "$TRENDRADAR_DIR"
            mkdir -p "$TRENDRADAR_DIR/config"
            mkdir -p "$TRENDRADAR_DIR/output"

            # 同步 docker-compose.yml 和 config 模板（不覆盖已存在的 .env）
            cp deploy/trendradar/docker-compose.yml "$TRENDRADAR_DIR/"
            cp deploy/trendradar/config/config.yaml "$TRENDRADAR_DIR/config/"
            cp deploy/trendradar/config/frequency_words.txt "$TRENDRADAR_DIR/config/"

            # 首次部署：从 .env.example 创建 .env
            if [ ! -f "$TRENDRADAR_DIR/.env" ]; then
              cp deploy/trendradar/.env.example "$TRENDRADAR_DIR/.env"
              chmod 600 "$TRENDRADAR_DIR/.env"
              echo "⚠️  TrendRadar .env 已创建，请编辑 $TRENDRADAR_DIR/.env 填入配置"
            fi

            # 拉取镜像并启动/重启容器（兼容 docker compose plugin 与旧版 docker-compose）
            if command -v docker &> /dev/null && docker compose version &> /dev/null; then
              cd "$TRENDRADAR_DIR"
              docker compose pull
              docker compose up -d
              echo "TrendRadar container started (docker compose)"
              cd /home/admin/foreverart-backend
            elif command -v docker-compose &> /dev/null; then
              cd "$TRENDRADAR_DIR"
              docker-compose pull
              docker-compose up -d
              echo "TrendRadar container started (docker-compose)"
              cd /home/admin/foreverart-backend
            else
              echo "⚠️  docker compose not found, TrendRadar not started"
            fi

            # nginx 配置：独立 server block
            sudo cp backend/nginx.conf /etc/nginx/sites-available/foreverart
            sudo ln -sf /etc/nginx/sites-available/foreverart /etc/nginx/sites-enabled/foreverart
            sudo cp landing/nginx.conf /etc/nginx/sites-available/foreverart-landing
            sudo ln -sf /etc/nginx/sites-available/foreverart-landing /etc/nginx/sites-enabled/foreverart-landing
            sudo cp web/nginx.conf /etc/nginx/sites-available/foreverart-app
            sudo ln -sf /etc/nginx/sites-available/foreverart-app /etc/nginx/sites-enabled/foreverart-app
            sudo cp web/nginx-news.conf /etc/nginx/sites-available/foreverart-news
            sudo ln -sf /etc/nginx/sites-available/foreverart-news /etc/nginx/sites-enabled/foreverart-news
            sudo nginx -t && sudo nginx -s reload

            sudo systemctl restart foreverart-api
            echo "Deployment completed!"
